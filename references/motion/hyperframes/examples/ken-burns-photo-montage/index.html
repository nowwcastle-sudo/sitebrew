<!doctype html>
<html
  lang="ko"
  data-composition-variables='[
    {"id":"cap1","type":"string","label":"장면 1 캡션","default":"갓 구운 식빵"},
    {"id":"cap2","type":"string","label":"장면 2 캡션","default":"버터 향 가득 크루아상"},
    {"id":"cap3","type":"string","label":"장면 3 캡션","default":"오늘도 새벽 여섯 시"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>wf ken burns montage</title>
    <link rel="stylesheet" href="assets/noto-sans-kr-700.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Noto Sans KR", sans-serif; font-weight: 700; color: #fff; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
      .cap { position: absolute; left: 120px; bottom: 100px; font-size: 84px; letter-spacing: -0.03em; text-shadow: 0 4px 24px rgba(0,0,0,0.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-start="0" data-duration="2.9" data-track-index="0"><img id="im1" src="assets/s1.jpg" /><div id="c1" class="cap"></div></div>
      <div id="sc2" class="scene clip" data-start="2.7" data-duration="2.9" data-track-index="1"><img id="im2" src="assets/s2.jpg" /><div id="c2" class="cap"></div></div>
      <div id="sc3" class="scene clip" data-start="5.4" data-duration="2.6" data-track-index="2"><img id="im3" src="assets/s3.jpg" /><div id="c3" class="cap"></div></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      document.getElementById("c1").textContent = v.cap1;
      document.getElementById("c2").textContent = v.cap2;
      document.getElementById("c3").textContent = v.cap3;
      document.fonts.load('700 100px "Noto Sans KR"', v.cap1 + v.cap2 + v.cap3).then(() => document.fonts.ready).then(() => {
        const tl = gsap.timeline({ paused: true });
        // Ken Burns: slow push-in / pull-back / drift on the INNER img (never on the timed clip wrapper)
        tl.fromTo("#im1", { scale: 1.0, x: 0 }, { scale: 1.12, x: -30, duration: 2.9, ease: "none", immediateRender: false }, 0);
        tl.fromTo("#im2", { scale: 1.14, x: 30 }, { scale: 1.0, x: 0, duration: 2.9, ease: "none", immediateRender: false }, 2.7);
        tl.fromTo("#im3", { scale: 1.0, y: 0 }, { scale: 1.1, y: -24, duration: 2.6, ease: "none", immediateRender: false }, 5.4);
        // 0.2s crossfade: the later scene fades IN over the earlier one (opacity on the clip wrapper is allowed; autoAlpha/visibility are not)
        tl.fromTo("#sc2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, 2.7);
        tl.fromTo("#sc3", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, 5.4);
        // scene 1 caption has NO entrance tween: t=0 must already be the composed poster pose (a fromTo with immediateRender:false would blink visible -> hidden -> visible)
        tl.fromTo("#c2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.9);
        tl.fromTo("#c3", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 5.6);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
