# OSV-Scanner 예외(P3-8). 항목마다 ignoreUntil(만료일)과 reason 이 있어야 한다 — 만료되면 다시 실패해서 다시 판정하게 된다.
# 형식: [[IgnoredVulns]] id = "<GHSA/CVE/OSV id>" · ignoreUntil = <날짜> · reason = "<왜 괜찮은가>". 별칭 id 도 같이 무시된다(문서).
# 새 예외를 더하기 전에 고치는 쪽(버전 올리기)을 먼저 본다 — 고칠 버전이 있으면 예외가 아니라 올린다.

