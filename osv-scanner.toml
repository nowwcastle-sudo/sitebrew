# OSV-Scanner 예외(P3-8). 항목마다 ignoreUntil(만료일)과 reason 이 있어야 한다 — 만료되면 다시 실패해서 다시 판정하게 된다.
# 형식: [[IgnoredVulns]] id = "<GHSA/CVE/OSV id>" · ignoreUntil = <날짜> · reason = "<왜 괜찮은가>". 별칭 id 도 같이 무시된다(문서).
# 새 예외를 더하기 전에 고치는 쪽(버전 올리기)을 먼저 본다 — 고칠 버전이 있으면 예외가 아니라 올린다.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-05
reason = "braces <= 3.0.3 스택 소진 DoS(CVE-2026-93687, 고친 버전 없음 — 2026-10-05 확인). 경로 shadcn@4.21.0 → fast-glob → micromatch → braces 는 레지스트리 빌드(shadcn build) 때 우리 파일 glob 에만 쓰고 외부 입력을 받지 않는다. 고친 버전이 나오면 올리고 이 예외를 지운다."

