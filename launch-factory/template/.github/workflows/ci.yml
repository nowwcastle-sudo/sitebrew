# 제품 CI(launch-factory 템플릿이 실어 준 복사본 — 오늘 바로 돈다). 한 줄: `npm run ci:verify`(scripts/ci/verify.mjs). 로컬과 CI 가 같은 명령이다.
# 보안 도구(actionlint·zizmor·gitleaks·osv-scanner)는 이 작업이 고정판을 받아(sha256 확인) 쓴다. 목록은 scripts/ci/tools.json — 직접 고치지 말고 launch-factory 에서 받는다(template:check 가 어긋남을 잡는다).
# 같은 내용을 launch-factory 의 재사용 워크플로로 부르는 호출부는 ci-caller.yml.example 에 있다(저장소 Actions 접근 설정이 켜져 있어야 한다 — docs/qa/vr-phase1.md).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"

      # 잠금 파일이 있을 때만 설치한다(제품이 막 만들어져 잠금 파일이 없으면 보안 단계만 돈다). 설치에 실패하면 그것이 제품의 진짜 상태다.
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Fetch pinned security tools (sha256 verified)
        run: node scripts/ci/tools.mjs fetch

      # 빌드 스모크(smoke 단계)는 아래 build-smoke 작업이 따로 돈다 — 로컬 ci:verify 는 둘을 한 번에 돈다.
      - name: ci:verify
        env:
          LF_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run ci:verify -- --skip smoke

  # 빌드 스모크(LFSMOKE): 제품을 실제로 빌드해 `next start` 로 띄우고 Playwright 로 본다 — mock 장면 × 쪽 200·오류 경계·axe(경고) + live 켜짐(필수 이름만 가짜 값).
  # 잠금 파일이 없으면(제품이 막 만들어짐) 건너뛴다. verify 가 통과한 뒤에만 돈다. 실패하면 보고서·추적(trace)을 artifact 로 올린다.
  build-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"

      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install browser (Playwright chromium)
        if: hashFiles('package-lock.json') != ''
        run: npx playwright install --with-deps chromium

      - name: build-smoke
        if: hashFiles('package-lock.json') != ''
        run: npm run ci:verify -- --only smoke

      - name: Upload smoke report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report
          path: .tmp/smoke
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
