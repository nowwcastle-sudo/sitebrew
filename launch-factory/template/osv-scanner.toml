# OSV-Scanner 예외(제품) — 처음 놓을 때만 쓰는 「제품 것」 파일이다(template:check 해시 검사 제외). 제품이 자기 잠금 파일에 맞게 고친다.
# 예외는 취약점 ID 단위로만, ignoreUntil(만료일)과 reason 을 반드시 단다. 만료일이 지나면 예외가 풀려 다시 실패한다.
# 시작 목록은 launch-factory 가 같은 의존 사슬에서 2026-10-07 에 판단한 두 건이다. 제품 잠금 파일에 없으면 OSV-Scanner 는 이 항목을 그냥 쓰지 않는다 — 없는 줄은 지워도 된다.
# 형식: https://github.com/google/osv-scanner/blob/v2.6.0/docs/configuration.md

[[IgnoredVulns]]
