<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 티 fixture — clean</title>
<style>
  :root { color-scheme: light dark; --paper: #fbfaf7; --ink: #1c1b19; --line: #d6d3cc; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1c1b19; --ink: #f3f1ec; --line: #4a4843; } }
  html { overflow-x: clip; }
  body { margin: 0; font-family: "Noto Sans KR", sans-serif; font-size: 16px; line-height: 1.7; background: var(--paper); color: var(--ink); word-break: keep-all; }
  ::selection { background: #cfd8e3; color: #1c1b19; }
  main { max-width: 40rem; margin-inline: auto; padding-inline: 16px; }
  h1 { font-size: 2.5rem; line-height: 1.25; font-weight: 700; margin-block: 48px 16px; }
  h2 { font-size: 1.25rem; line-height: 1.4; font-weight: 700; margin-block: 40px 8px; }
  p { font-weight: 400; margin-block: 0 16px; }
  a { color: #1f4e79; touch-action: manipulation; }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border: 1px solid #1c1b19; border-radius: 6px; background: #1c1b19; color: #fbfaf7; touch-action: manipulation; }
</style>
</head>
<body>
<main>
  <h1>예시 동네 빵집의 이번 주 빵</h1>
  <p>화요일과 금요일 아침에 굽는 빵을 적어 둡니다. 남은 빵은 저녁에 반값으로 팝니다.</p>
  <button type="button">주문 문의하기</button>
  <section>
    <h2>굽는 날</h2>
    <p>화요일에는 통밀빵을, 금요일에는 호밀빵을 굽습니다.</p>
  </section>
  <section>
    <h2>찾아오는 길</h2>
    <p>예시 시장 입구에서 오른쪽으로 들어오면 첫 번째 가게입니다. <a href="#map">약도 보기</a></p>
  </section>
</main>
</body>
</html>
