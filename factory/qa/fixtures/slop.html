<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 티 fixture — slop</title>
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #ffffff; color: #1a1a1a; }
  .hero { padding: 64px 24px; text-align: center; }
  .hero h1 {
    font-size: 56px;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card { padding: 24px; border-radius: 16px; box-shadow: 0 0 24px rgba(168, 85, 247, 0.6); transition: all .3s ease-in-out; }
  .num { font-size: 13px; color: #6b7280; }
  .cta { padding: 12px 20px; border: 0; border-radius: 8px; background: #6366f1; color: white; transition: all .3s ease-in-out; }
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>예시 브랜드로 업무를 한 단계 끌어올리세요</h1>
    <p>솔직히 말하면, 이것은 도구가 아니라 새로운 방식입니다.</p>
    <button class="cta" type="button">지금 시작 — 무료</button>
  </section>
  <section>
    <div class="card"><span class="num">01</span><h2>빠른 시작</h2><ul><li>🚀 몇 초 만에 설치</li><li>✨ 자동으로 정리</li><li>🔒 안전한 보관</li></ul></div>
    <div class="card"><span class="num">02</span><h2>함께 쓰기</h2><p>팀 전체가 같은 화면을 봅니다.</p></div>
    <div class="card"><span class="num">03</span><h2>한눈에 보기</h2><p>10k+ 팀 · 99.9% 가동 · 24/7 지원 (예시 수치)</p></div>
  </section>
</main>
</body>
</html>
