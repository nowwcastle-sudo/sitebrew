<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA fixture — audit good</title>
<style>
  html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; }
  nav { position: sticky; top: 0; background: #ffffff; border-bottom: 1px solid #ccc; padding: 12px 16px; }
  main { padding: 16px; max-width: 640px; }
  p { color: #1a1a1a; font-size: 16px; }
  /* 16px checkbox with an invisible, absolutely-positioned ::after hit area
     (WCAG 2.5.8's accepted "undisplayed target area" technique). */
  .checkbox { position: relative; display: inline-block; width: 16px; height: 16px; border: 1px solid #1a1a1a; border-radius: 4px; vertical-align: middle; }
  .checkbox::after { position: absolute; inset: -14px; content: ""; }
  /* The same expander on a border-box 16px control with a 1px border: the
     ::after resolves against the 14px padding box, so the real hit area is
     42x42 — above 24 (passes) but under 44 (a targetsUnder44 warning). */
  .checkbox-42 { box-sizing: border-box; position: relative; display: inline-block; width: 16px; height: 16px; border: 1px solid #1a1a1a; border-radius: 4px; vertical-align: middle; }
  .checkbox-42::after { position: absolute; inset: -14px; content: ""; }
  /* Positive parent-scan case (slider-thumb pattern): a visually-hidden but
     focusable native input (the real keyboard/AT control) inside a
     positioned decorative wrapper whose ::after carries the hit area. The
     input itself is 1x1; the wrapper's expander makes it 44x44. */
  .thumb { position: relative; display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #1a1a1a; vertical-align: middle; }
  .thumb::after { position: absolute; inset: -14px; content: ""; }
  .thumb-input { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Base UI-style hidden mirror input used only for native form serialization. */
  .hidden-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
</style>
</head>
<body>
  <nav aria-label="fixture nav">audit-good fixture</nav>
  <main>
    <p>이 문단은 감사 대조군을 위한 본문 텍스트입니다. 충분히 길게 작성합니다.</p>

    <label style="display: inline-flex; align-items: center; gap: 8px;">
      <span class="checkbox" role="checkbox" aria-checked="true" aria-label="구독하기" tabindex="0"></span>
      구독하기
    </label>

    <p style="margin-top: 32px;">
      <span class="checkbox-42" role="checkbox" aria-checked="false" aria-label="42 체크박스" tabindex="0"></span>
    </p>

    <p style="margin-top: 32px;">
      <span class="thumb"><input class="thumb-input" type="range" min="0" max="100" value="50" aria-label="부모 확장 음량" /></span>
    </p>

    <input
      class="hidden-input"
      type="text"
      aria-hidden="true"
      tabindex="-1"
      value="mirror"
    />
  </main>
</body>
</html>
