<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>접근성 시험 쪽</title>
<style>
body{margin:0;font:16px/1.6 sans-serif;color:#111;background:#fff}
a{color:#0047b3}
@media (prefers-color-scheme: dark){body{color:#f2f2f2;background:#111}a{color:#9cf}}
main{padding:24px;max-width:640px}
label{display:block;margin:12px 0 4px}
input{min-height:32px;min-width:240px;font:inherit}
button{min-height:44px;min-width:88px;font:inherit}

</style></head><body><main>
<h1>좋은 쪽</h1>
<p>라이트·다크·강제 색 어디서도 대비가 충분하고, 눌리는 것은 24px 이상이며, 인증 칸은 붙여넣기와 비밀번호 관리자를 허용하고, 다단계 폼은 앞 값을 다시 묻지 않는다.</p>
<p><a href="#a" style="display:inline-block;min-height:44px;line-height:44px">첫째 링크</a> <a href="#b" style="display:inline-block;min-height:44px;line-height:44px">둘째 링크</a></p>
<form id="login" onsubmit="return false"><h2>로그인</h2>
<label for="u">아이디</label><input id="u" name="username" autocomplete="username">
<label for="p">비밀번호</label><input id="p" name="password" type="password" autocomplete="current-password">
<p><button type="submit">로그인</button></p></form>
<form id="wizard"><h2>주문</h2>
<div id="s1"><label for="em">이메일</label><input id="em" name="email" type="email" autocomplete="email"><p><button type="button" id="n1">다음</button></p></div>
<div id="s2" hidden><label for="ad">주소</label><input id="ad" name="address" autocomplete="street-address">
<label for="em2">이메일(앞에서 넣은 값)</label><input id="em2" name="email" type="email" autocomplete="email"><p><button type="submit">보내기</button></p></div></form>
<script>
document.getElementById('n1').addEventListener('click',()=>{const v=document.getElementById('em').value;document.getElementById('em2').value=v;document.getElementById('s1').hidden=true;document.getElementById('s2').hidden=false});
document.getElementById('wizard').addEventListener('submit',e=>e.preventDefault());
</script>
</main></body></html>
