<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA fixture — text-overlap-bad.html</title>
<style>
  /* 대장 C296 재현: 한 낱말 히어로(grid-lines-baseline-word 옛 모양) — 제목이 17.8vw 로 절대 배치되어 긴 제목이 오른쪽에서 잘리고 캡션 위에 겹친다.
     글자 쪼개기 제목(읽기용 sr-only 원문 + 눈에 보이는 aria-hidden 쪼갠 사본)까지 그대로 — aria-hidden 면제가 이 제목을 가리면 안 된다. */
  html, body { margin: 0; padding: 0; font-family: "Malgun Gothic", "Noto Sans CJK KR", "Apple SD Gothic Neo", system-ui, sans-serif; background: #ffffff; color: #1a1a1a; }
  nav { position: sticky; top: 0; z-index: 5; background: #ffffff; border-bottom: 1px solid #ccc; padding: 12px 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .gw { position: relative; overflow: clip; min-height: 400px; background: #eef6f9; }
  .caption { position: absolute; left: 4%; top: 44%; }
  .cap { margin: 0; font-size: 21px; line-height: 1.5; color: #1a1a1a; }
  .word { position: absolute; left: 0; right: 0; bottom: 3%; margin: 0; text-align: center; font-size: 17.8vw; line-height: 0.8; text-transform: uppercase; color: #0b4f6c; }
  .w { display: inline-block; white-space: nowrap; }
  .mask { display: inline-block; overflow: clip; padding-block: 0.12em; margin-block: -0.12em; vertical-align: bottom; }
  .ch { display: inline-block; }
  main > p { margin: 24px 16px; max-width: 640px; }
</style>
</head>
<body>
  <nav aria-label="fixture nav">text-overlap-bad fixture</nav>
  <main>
    <section class="gw" aria-label="첫 화면">
      <div class="caption"><p class="cap">월-금 08:30-18:00 · 토 09:00-13:00 · 일·공휴일 휴무<br />서울특별시 마포구 월드컵로 120, 2층</p></div>
      <h1 class="word" id="word"><span class="sr-only">마포구 월드컵로의 주야간보호센터</span><span aria-hidden="true" id="split"></span></h1>
    </section>
    <p>이 문단은 대비 검사를 위한 본문 텍스트입니다. 히어로 아래에 놓여 겹침 없이 읽혀야 합니다.</p>
  </main>
  <script>
    const title = '마포구 월드컵로의 주야간보호센터'
    const host = document.getElementById('split')
    title.split(' ').forEach((w, i) => {
      if (i) host.append(' ')
      const word = document.createElement('span'); word.className = 'w'
      for (const c of w) { const m = document.createElement('span'); m.className = 'mask'; const ch = document.createElement('span'); ch.className = 'ch'; ch.textContent = c; m.append(ch); word.append(m) }
      host.append(word)
    })
  </script>
</body>
</html>
