<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의</title>
<style>
body { font: 16px/1.6 system-ui, sans-serif; margin: 0; color: #111; background: #fff; }
main, header, footer { padding: 24px 32px; }
.b { display: inline-block; box-sizing: border-box; min-width: 160px; height: 48px; padding: 0 24px; font: 16px system-ui, sans-serif; border: 1px solid #222; background: #fff; color: #111; text-decoration: none; text-align: center; line-height: 46px; cursor: pointer; }
label { display: block; margin: 8px 0; } input, textarea { font: 16px system-ui, sans-serif; padding: 6px; }
blockquote { margin: 16px 0; padding-left: 16px; border-left: 4px solid #999; }
</style>
</head>
<body>
<header><nav aria-label="주 메뉴"><a href="/">홈</a> · <a href="/contact">문의</a> · <a href="/account">계정</a></nav></header>
<main>
<h1>문의해요</h1>
<form id="f">
<label>이름 <input name="name" required></label>
<label>이메일 <input type="email" name="email" required></label>
<label>내용 <textarea name="message" required></textarea></label>
<button class="b" type="submit">문의 보내기</button>
</form>
<p id="s" role="status"></p>
<script>
const f = document.getElementById('f'), s = document.getElementById('s')
f.addEventListener('submit', async (e) => {
  e.preventDefault()
  s.textContent = '접수했어요. 곧 답해 드려요.'
})
</script>
</main>
<footer><p data-legal>이용 조건과 사업자 정보는 법에 따라 안내합니다.</p></footer>
</body>
</html>
