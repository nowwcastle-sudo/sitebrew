<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>strict fixture — dashboard-overview-good</title>
<style>
  html, body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1a1a1a; }
  header { padding: 12px 16px; border-bottom: 1px solid #ccc; }
  header nav a { margin-right: 12px; color: #1a1a1a; }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  ul { list-style: none; padding: 0; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .card, .kpi { border: 1px solid #ccc; padding: 12px; border-radius: 8px; }
  .filler { height: 2000px; }
</style>
</head>
<body>
<header><nav aria-label="주 메뉴"><a href="/">개요</a><a href="/orders">주문</a><a href="/settings">설정</a></nav></header>
<main>
  <h1>운영 현황</h1>
  <section data-block="dashboard-panel-kpi-first">
    <p>기준 시각 <span data-numeric>2026-10-10 09:00</span></p>
    <div class="grid">
      <div class="kpi"><span class="label">오늘 접수</span> <span class="row"><span data-numeric class="value">1,284<span class="unit">건</span></span> <span class="delta" data-direction="up"><span data-numeric aria-hidden="true">+3.2%</span><span style="position:absolute;width:1px;height:1px;overflow:hidden">지난주보다 늘었어요</span></span></span></div>
      <div class="kpi"><span class="label">처리율</span> <span class="row"><span data-numeric class="value">98.2<span class="unit">%</span></span> <span class="delta" data-direction="up"><span data-numeric aria-hidden="true">+0.4%</span><span style="position:absolute;width:1px;height:1px;overflow:hidden">지난주보다 늘었어요</span></span></span></div>
      <div class="kpi"><span class="label">평균 응답</span> <span class="row"><span data-numeric class="value">37<span class="unit">분</span></span> <span class="delta" data-direction="up"><span data-numeric aria-hidden="true">−5분</span><span style="position:absolute;width:1px;height:1px;overflow:hidden">지난주보다 늘었어요</span></span></span></div>
      <div class="kpi"><span class="label">미처리</span> <span class="row"><span data-numeric class="value">12<span class="unit">건</span></span> <span class="delta" data-direction="up"><span data-numeric aria-hidden="true">−2건</span><span style="position:absolute;width:1px;height:1px;overflow:hidden">지난주보다 늘었어요</span></span></span></div>
    </div>
  </section>
  <section data-block="dashboard-panel-trend-plus-table">
    <h2>최근 7일 추이</h2>
    <table><caption>일별 접수</caption><tr><th>월</th><td>1,102</td></tr><tr><th>화</th><td>1,190</td></tr></table>
  </section>
  <div class="filler"></div>
</main>
</body>
</html>
