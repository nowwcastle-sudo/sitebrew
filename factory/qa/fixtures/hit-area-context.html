<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>히트 영역 — 예외의 맥락·잘림·label</title>
<style>
  body { font: 16px/1.7 sans-serif; padding: 48px; }
  .row { display: flex; gap: 48px; align-items: center; margin-bottom: 48px; }
  .box24 { position: relative; width: 24px; height: 24px; border: 0; padding: 0; background: #ddd; }
  /* 44 식: 24px 요소 → -10px */
  .f44::after { content: ""; position: absolute; inset: min(0px, calc((100% - 44px) / 2)); }
  .clip { overflow: hidden; }
  a.inline-ish { display: inline-block; line-height: 27px; }
</style>
</head>
<body>
  <!-- 묶음 안 radio: 예외(24) → 통과 -->
  <div class="row" data-slot="radio-group" role="radiogroup" aria-label="묶음">
    <button class="box24" role="radio" aria-checked="false" data-slot="radio-group-item" aria-label="묶음 안 라디오"></button>
  </div>
  <!-- 묶음 밖 radio: 예외 아님, 식 없음 → 44 미만 실패 -->
  <div class="row">
    <button class="box24" role="radio" aria-checked="false" data-slot="radio-group-item" aria-label="혼자 라디오"></button>
  </div>
  <!-- Button 으로 그린 트리거: 예외 아님 → 24 는 실패 -->
  <div class="row">
    <button class="box24 group/button" data-slot="dialog-trigger" aria-label="버튼 트리거"></button>
    <!-- 소비자 링크 트리거: 예외(24) → 통과 -->
    <a class="inline-ish" href="#x" data-slot="hover-card-trigger">링크 트리거</a>
  </div>
  <!-- 식이 있어도 overflow:hidden 이 ::after 를 자르면 → 실패 -->
  <div class="row" data-slot="button-row">
    <button class="box24 f44 clip" data-slot="button" aria-label="잘린 식"></button>
    <button class="box24 f44" data-slot="button" aria-label="안 잘린 식"></button>
  </div>
  <!-- 스크롤 칸 가장자리(C374): 스크롤 칸의 보이는 아래 끝이 ::after 를 자르지만 스크롤하면 닿는 자리라 잘림이 아니다 — 스크롤해 들인 뒤 재서 44 → 통과 -->
  <div data-slot="scroll-area" style="height: 80px; overflow-y: auto; border: 1px solid #ccc; margin-bottom: 48px; padding: 0 16px;">
    <div style="height: 56px;"></div>
    <button class="box24 f44" data-slot="button" aria-label="스크롤 칸 가장자리"></button>
    <div style="height: 200px;"></div>
  </div>
  <!-- label 안 투명 input: label(식 포함)과 합쳐 잰다 → 통과 -->
  <div class="row" data-slot="questionnaire-choices">
    <label class="f44" data-slot="questionnaire-choice" style="position: relative; display: flex; height: 24px; align-items: center; padding: 0 12px;">
      <input type="radio" name="q" aria-label="선택지" style="position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%;">
      흰 우유
    </label>
  </div>
</body>
</html>
