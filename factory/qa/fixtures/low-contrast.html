<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA fixture — low contrast</title>
<style>
  html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; }
  nav { position: sticky; top: 0; background: #ffffff; border-bottom: 1px solid #ccc; padding: 12px 16px; }
  main { padding: 16px; max-width: 640px; min-height: 300vh; }
  .faint { color: #999999; }
</style>
</head>
<body>
  <nav aria-label="fixture nav">low-contrast fixture</nav>
  <main>
    <!-- 본문이 p 가 아니라 잎 div 에 있다: 게이트가 div 를 세지 않으면 이 결함을 못 본다. #999 on #fff ≈ 2.8:1 -->
    <div class="faint">이 설명 문장은 흐린 회색이라 본문 대비 7:1 기준에 한참 못 미칩니다(예시).</div>
  </main>
</body>
</html>
