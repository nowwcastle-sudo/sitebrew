<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA fixture — 표와 짧은 이름표뿐인 목록 쪽(관리 목록 모양)</title>
<style>
  html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; }
  nav { position: sticky; top: 0; background: #ffffff; border-bottom: 1px solid #ccc; padding: 12px 16px; }
  main { padding: 16px; max-width: 720px; min-height: 300vh; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; color: #1a1a1a; }
</style>
</head>
<body>
  <nav aria-label="fixture nav">관리 목록</nav>
  <main>
    <h1>전체 목록</h1>
    <!-- 20자를 넘는 글 상자가 하나도 없다 — 표 칸·이름표는 짧다. 그래도 대비는 재야 한다(QFIX3: 20자 규칙이 이런 쪽을 「측정 없음」으로 떨어뜨렸다). -->
    <label for="q">목록 검색</label> <input id="q" type="search" />
    <table>
      <caption>목록 표</caption>
      <thead><tr><th scope="col">품목</th><th scope="col">보관 구역</th><th scope="col">재고 수</th></tr></thead>
      <tbody>
        <tr><td>라벨 용지</td><td>A구역</td><td>120</td></tr>
        <tr><td>포장 박스</td><td>B구역</td><td>84</td></tr>
        <tr><td>완충재 롤</td><td>B구역</td><td>36</td></tr>
        <tr><td>박스 테이프</td><td>A구역</td><td>210</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
