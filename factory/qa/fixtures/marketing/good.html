<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 관문 — 통과 예시</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; color: #111; background: #fff; }
  section { padding: 32px; border-bottom: 1px solid #ddd; }
  .b { display: inline-block; box-sizing: border-box; min-width: 160px; height: 48px; padding: 0 24px; font: 16px system-ui, sans-serif; border: 1px solid #222; background: #fff; color: #111; text-decoration: none; text-align: center; line-height: 46px; cursor: pointer; }
  table { border-collapse: collapse; } th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: left; }
  [data-seller-reply] { margin-left: 16px; padding: 8px 12px; border-left: 4px solid #666; background: #f3f3f3; }
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"모아플랜","offers":{"@type":"Offer","price":"9900","priceCurrency":"KRW"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.8","reviewCount":"1284"}}</script>
</head>
<body>
<main>
  <section id="pricing" data-section="pricing">
    <h2>요금</h2>
    <table>
      <caption>요금제 비교</caption>
      <thead><tr><th scope="col">요금제</th><th scope="col">월 요금</th></tr></thead>
      <tbody><tr><th scope="row">베이직</th><td><span data-price="billed">9,900원</span></td></tr></tbody>
    </table>
    <p data-total>총 결제 금액 9,900원(VAT 포함) · 배송비·설치비 없음</p>
    <p><small data-price="equivalent" style="font-size:12px">하루 약 330원</small></p>
    <a class="b" href="#start" data-slot="button" data-primary-action>무료로 시작하기</a>
    <p data-guarantee data-guarantee-days="14">14일 안에 마음에 들지 않으면 환불해 드려요.</p>
    <p data-escrow>결제대금예치(에스크로)로 결제할 수 있어요.</p>
  </section>

  <section id="reviews">
    <h2>후기 <span>4.8점 · 후기 1,284개</span></h2>
    <div data-review>
      <p>쓰기 편해요.</p>
      <div data-seller-reply><strong>판매자 답변</strong> 이용해 주셔서 고마워요.</div>
    </div>
    <fieldset data-rating-ask>
      <legend>별점을 골라 주세요</legend>
      <label><input type="radio" name="rating" value="1"> 1점</label>
      <label><input type="radio" name="rating" value="2"> 2점</label>
      <label><input type="radio" name="rating" value="3"> 3점</label>
      <label><input type="radio" name="rating" value="4"> 4점</label>
      <label><input type="radio" name="rating" value="5"> 5점</label>
    </fieldset>
  </section>

  <section id="signup">
    <h2>가입</h2>
    <div data-flow="signup" data-step="1" data-steps="3"><p>1/3 계정 만들기</p></div>
    <label><input type="checkbox" name="marketing-email"> 이벤트 안내를 이메일로 받아요(선택)</label>
    <label><input type="checkbox" name="terms" data-consent="required"> 이용약관에 동의해요(필수)</label>
  </section>

  <section id="cancel-section">
    <h2>해지</h2>
    <div id="cancel" data-flow="cancel" data-step="1" data-steps="2">
      <div role="group" aria-label="해지 방식" data-choice-group>
        <button type="button" class="b" data-choice="primary">계속 쓰기</button>
        <button type="button" class="b" data-choice="decline" id="dec">해지 계속하기</button>
      </div>
    </div>
  </section>

  <section id="promo">
    <h2>소식</h2>
    <p>이번 행사는 <span data-countdown data-ends-at="2030-01-01T00:00:00.000Z"><span data-numeric>1200</span>일 남았어요</span>.</p>
    <div data-flow="onboarding" data-step="1" data-steps="3"><p>1/3 시작하기</p></div>
    <a class="b" href="#next" data-slot="button" data-next-action>대시보드 열기</a>
  </section>
</main>
<script>
  // 해지 흐름: 거절 버튼만 눌러 data-steps 까지 간다. data-nodecline-at 은 시험용 훅(그 단계에서 거절 버튼을 숨긴다).
  (() => {
    const c = document.getElementById('cancel'), dec = document.getElementById('dec')
    dec.addEventListener('click', () => {
      const s = Number(c.dataset.step) + 1
      c.dataset.step = String(s)
      if (s >= Number(c.dataset.steps)) {
        c.querySelector('[data-choice-group]').style.display = 'none'
        const p = document.createElement('p'); p.setAttribute('data-end-date', '2026-10-31'); p.textContent = '10월 31일까지 쓸 수 있어요.'
        c.append(p)
      } else dec.style.display = String(s) === c.dataset.nodeclineAt ? 'none' : ''
    })
  })()
</script>
</body>
</html>
