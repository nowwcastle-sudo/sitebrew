  # ---- 범위·세기·부정(갈래 E) ----
  # modifier 는 reading 이 없고 effect 만 있다. 한국어 cap(않게)은 바로 앞 낱말 묶음에, 그 밖(세기·범위·영어 not)은 바로 뒤 묶음에 붙는다.
  # 사이에 낱말이 끼면 붙이지 않는다(군말·「부분」「색을」 같은 이름 뒤 꼬리는 grammar.yaml 의 match.gapOk). effect 가 비어 있는 항목은 낱말을 먹기만 한다(축으로 못 옮기는 말을 엉뚱한 축으로 읽지 않게).
  # element 범위는 제목·본문·버튼·사진·배경·아이콘, section 범위는 구획 kind 이름(위 revise.sections 와 같다), page 범위는 revise.pages 키. 어디까지 실행하는지는 계획 2가 정한다(설계 5.10).

  - id: slightly
    kind: modifier
    label: 조금
    match:
      ko: ["조금", "살짝", "약간", "은근", "슬쩍", "소소하게", "미세하게"]
      en: ["slightly", "somewhat", "bit", "little"]
    effect: { strength: 1 }

  - id: greatly
    kind: modifier
    label: 확
    match:
      ko: ["확", "훨씬", "엄청", "아주", "매우", "완전", "진짜", "정말", "되게", "최대한", "극도로", "한껏", "너무너무", "많이많이", "더더", "엄청나게"]
      en: ["much", "very", "really", "way", "super", "extremely", "significantly"]
    not: ["완전 동그랗", "완전 둥글", "완전 둥근", "최대한 둥글"]
    effect: { strength: 2 }

  - id: scope-site
