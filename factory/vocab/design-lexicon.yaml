# 디자인 어휘 사전 원본(설계 5.2~5.5, 5.9). 도구와 스킬 레퍼런스가 모두 이 파일에서 나온다. 규칙은 factory/vocab/lexicon.mjs 가 검사한다.
#   axes   : 12개 고정. label = 사용자에게 쓰는 이름, ends = 방향 id 둘 [마이너스 끝, 플러스 끝](reading 의 direction 은 이 둘 중 하나), endLabels = 그 끝의 사용자 표기,
#            order = 축 값 순서(세기 +1 = 한 칸, +2 = 두 칸 또는 끝). 색(color-hue)·글꼴(type-family)은 ends 가 없고 reading 에 direction 대신 value 를 쓴다.
#            valueLabels = value 를 쓰는 축의 값 id → 사용자 표기(reading 이 쓰는 value 는 모두 있어야 한다).
#            rank = 등급형 축의 값 → 등급(같은 등급은 같은 칸, 낮은 쪽 = ends[0]). order 와 함께 두지 않는다.
#            names = 사용자가 이 축을 이름으로 부르는 말(정규식 원문 · 대소문자 무시) — 구획 이름과 함께 나온 「색」「서체」처럼 축만 말한 문장을 알아본다(방향 낱말과 별개).
#            sectionIntent = 구획 교체로 실행할 때 방향(ends) → 구획 의도(bolder|calmer 또는 { density: … }). 칸이 없는 축은 구획만 바꿀 수 없다.
#            strength 는 0..2 크기다(부호는 direction 이 지닌다).
#   entries: kind(modifier|reference|diagnosis|impression|axis) 하나씩. reading 축은 1~4개, 낱말은 한 항목에만, 두 항목이 축 3개 이상 겹치면 합친다.
#   confidence low 항목은 reading 대신 causes 두 개(보여 주며 묻기, 5.10).
#   expansions: 막는 말(not)과 「덜 ~」 낱말의 틀. 반복되는 말은 낱말마다 적지 않고 틀로 둔다 — 항목의 copyWords·dislikeStems·cardNames·lessStems·lessLite 가 재료다. 아래 expansions 주석을 본다.
axes:
  color-hue: { label: 색, names: ["색상", "색감", "컬러", "배색", "팔레트", "(?<![검탐사])색(?![다인출])", "(?<![a-z])colou?rs?(?![a-z])", "(?<![a-z])palette(?![a-z])", "(?<![a-z])hue(?![a-z])"], valueLabels: { red: 빨강, orange: 주황, yellow: 노랑, green: 초록, teal: 청록, blue: 파랑, navy: 남색, purple: 보라, pink: 분홍, brown: 갈색, beige: 베이지, black: 검정, gray: 회색, white: 흰색, gold: 금색, sky: 하늘색, coral: 산호색, lavender: 연보라, olive: 올리브색, burgundy: 진한 와인색, away-from-indigo-violet: 보라·남색에서 먼 색 } }
  color-lightness: { label: 밝기, ends: [dark, bright], endLabels: [어둡게, 밝게] }
  color-saturation: { label: 색의 진하기, ends: [muted, vivid], endLabels: [흐리게, 쨍하게] }
  color-temperature: { label: 색 온도, ends: [cool, warm], endLabels: [차갑게, 따뜻하게] }
  palette-count: { label: 색 가짓수, ends: [fewer, more], endLabels: [적게, 많게], rank: { K3: 0, K9: 0, K1: 1, K5: 1, K4: 2, K7: 2, K2: 3, K6: 3, K8: 4 } }
  contrast: { label: 대비, ends: [soft, crisp], endLabels: [은은하게, 또렷하게], rank: { C3: 0, C5: 0, C1: 1, C4: 1, C2: 2, C6: 3, C8: 3 }, sectionIntent: { crisp: bolder, soft: calmer } }
  type-family: { label: 글꼴, names: ["서체", "글꼴", "폰트", "글자체", "타이포", "(?<![a-z])typefaces?(?![a-z])", "(?<![a-z])fonts?(?![a-z])", "(?<![a-z])typography(?![a-z])"], valueLabels: { distinctive: 흔하지 않은 글꼴, rounded-sans: 둥근 고딕, serif-or-thin-sans: 명조나 가는 고딕, clear-sans: 또박또박한 고딕, serif-or-slab: 옛 느낌의 명조, serif: 명조, sans: 고딕, handwriting: 손글씨, mono: 고정폭 글꼴 } }
  type-scale: { label: 글자 크기, ends: [smaller, larger], endLabels: [작게, 크게], order: [D1, D2, D3], sectionIntent: { larger: bolder, smaller: calmer } }
  spacing: { label: 여백, ends: [tight, airy], endLabels: [빽빽하게, 시원하게], order: [tight, normal, airy], sectionIntent: { airy: { density: spacious }, tight: { density: compact } } }
  shape: { label: 모서리, ends: [sharp, round], endLabels: [각지게, 둥글게], order: [R0, R1, R2, R3] }
  depth: { label: 입체감, ends: [flat, lifted], endLabels: [납작하게, 떠 보이게], rank: { S0: 0, S1: 1, S2: 1, S3: 2 }, sectionIntent: { lifted: bolder, flat: calmer } }
  motion: { label: 움직임, names: ["모션", "움직임", "애니메이션", "(?<![a-z])animations?(?![a-z])", "(?<![a-z])motion(?![a-z])", "(?<![a-z])movement(?![a-z])"], ends: [static, dynamic], endLabels: [정적으로, 역동적으로], order: [M0, M1, M2, M3], sectionIntent: { dynamic: bolder, static: calmer } }

revise:
  # 말 → 구획·쪽 이름표(설계 5.10). 이 사전이 유일본이다(revise-parse.mjs 가 읽어 구조 조작에도 넘긴다).
  #   sections / extraSections: kind = 사이트 구획 kind 에 맞추는 정규식 원문, words = 그 구획을 가리키는 말. extraSections 는 구조 조작(구획 더하기·빼기·옮기기)만 쓰는 이름표다.
  #   pages: 쪽 키 → 쪽을 가리키는 말.
  sections:
    - { kind: "^hero", words: ["히어로", "첫 화면", "첫화면", "메인 배너", "상단 배너", "대문", "메인 화면", "메인 비주얼", "맨 위", "hero", "banner", "above the fold", "main visual"] }
    - { kind: "^(?:faq|qna)$", words: ["자주 묻는 질문", "질문", "q&a", "faq", "questions"] }
    - { kind: "^(?:pricing|paywall|plans?)(?:-|$)", words: ["요금제", "요금", "가격", "플랜", "구독료", "pricing", "prices", "price", "plans", "plan"] }
    - { kind: "(?:^|-)features?$", words: ["기능", "특징", "장점", "features", "feature", "benefits"] }
    - { kind: "^(?:social-proof|testimonials?|reviews?|external-reviews|review-list)$", words: ["후기", "리뷰", "고객 평가", "추천사", "사용 후기", "testimonials", "reviews", "social proof"] }
    - { kind: "^footer", words: ["푸터", "바닥글", "맨 아래", "하단 정보", "footer"] }
    - { kind: "^(?:final-cta|cta)$", words: ["마지막 행동", "최종 행동", "행동 유도", "하단 버튼", "final cta", "call to action", "cta"] }
    - { kind: "^contact-form$", words: ["문의 폼", "문의", "연락", "contact"] }
    - { kind: "^menu", words: ["메뉴", "가격표", "menu"] }
    - { kind: "^hours", words: ["영업시간", "운영 시간", "hours", "opening hours"] }
    - { kind: "^directions$", words: ["오시는 길", "찾아오는 길", "지도", "directions", "map", "location"] }
    - { kind: "^gallery$", words: ["갤러리", "사진", "gallery", "photos"] }
    - { kind: "^integrations?$", words: ["연동", "통합", "integrations", "integration"] }
    - { kind: "^(?:how-it-works|workflow)", words: ["사용 방법", "이용 방법", "진행 방식", "작동 방식", "how it works"] }
    - { kind: "^(?:notice|announcement)", words: ["공지", "알림 띠", "announcement", "notice"] }
    - { kind: "^auth$", words: ["가입 폼", "로그인 폼", "인증", "sign-in form", "sign-up form"] }
  extraSections:
    - { kind: "^directions$", words: ["위치", "약도"] }
    - { kind: "^hours", words: ["영업 시간", "운영시간"] }
    - { kind: "^branches$", words: ["지점", "매장", "branches", "branch"] }
    - { kind: "^departments$", words: ["진료과", "진료 과목", "departments", "department"] }
    - { kind: "^doctors$", words: ["의료진", "doctors"] }
    - { kind: "^enterprise$", words: ["엔터프라이즈", "기업용", "enterprise"] }
    - { kind: "^changelog$", words: ["변경 내역", "업데이트 내역", "changelog", "release notes"] }
  pages:
    home: ["홈", "메인 페이지", "홈페이지", "home", "homepage"]
    campaign: ["캠페인", "campaign"]
    pricing: ["요금제 쪽", "가격 쪽", "pricing page"]
    signup: ["가입 쪽", "signup page", "sign-up page"]
    login: ["로그인 쪽", "login page"]

expansions:
  # 막는 말(not)과 「덜 ~」 낱말의 틀. loadLexicon 이 항목의 copyWords·dislikeStems·cardNames·lessStems 와 짝지어 펼친다(factory/vocab/expand.mjs). {n}·{w}·{s}·{a}·{b} 가 자리표시자다.
  #   copy      「문구 더 따뜻」 — 글 속 말투를 가리키는 말은 색 얘기가 아니다. 글 이름(nouns) × forms × 항목의 copyWords 를 그 항목의 not 에 보탠다.
  #   dislike   「답답해서 싫」 — 진단 낱말 뒤의 싫다는 말은 그 낱말을 고치라는 뜻이라 따로 읽지 않는다. 항목의 dislikeStems 를 not 에 보탠다.
  #   reference 모든 참고 카드는 기능 이름(「스타일 결제」)을 막고, pairs 로 묶인 카드 둘은 서로의 이름을 접속어로 이은 말(「애플이나토스」)을 막는다(cardNames 를 쓴다).
  #   less      「덜 ~」·「~한 거 줄」 — 항목의 lessStems(true = match.ko 의 띄어쓰기 없는 낱말 전부, minStem 글자 이상 · 목록 = 그 낱말만)는 forms 꼴로, lessLite(반대쪽 항목이 나머지 꼴을 갖고 있는 축 낱말)는 liteForms 꼴로
  #             낱말을 만들어 into 항목의 match.ko 에 넣는다. 다른 항목이 이미 가진 낱말은 뺀다. 새 인상·축 낱말은 match.ko 에 보태기만 하면 lessStems: true 항목에서는 따라온다.
  copy:
    nouns: ["문구", "문장", "카피", "멘트", "말투", "글투", "문체", "소개글", "소개 글", "소개 문구", "설명 글", "설명 문구", "글이", "글을", "슬로건", "캐치프레이즈", "인사말", "소개말", "안내문", "안내 문구", "광고 문구", "홍보 문구"]
    forms: ["{n} {w}", "{n}도 {w}", "{n}만 {w}", "{n} 더 {w}", "{n} 조금 {w}", "{n} 조금 더 {w}", "{n} 너무 {w}", "{n} 훨씬 {w}", "{n} 더욱 {w}", "{n} 아주 {w}"]
  dislike: ["{w} 싫", "{w}서 싫", "{w} 질색"]
  reference:
    features:
      styles: ["스타일", "디자인", "ui", "ux"]
      nouns: ["잔디", "그래프", "기능", "결제", "송금", "주문", "예약", "알림", "로그인", "채팅", "피드", "목록", "구독", "인증", "검색", "추천", "쿠폰", "장바구니", "배송"]
      forms: ["{s} {n}"]
    pairs: [["ref-toss", "ref-apple"], ["ref-notion", "ref-slack"], ["ref-kakao", "ref-naver"], ["ref-daangn", "ref-airbnb"], ["ref-coupang", "ref-musinsa"], ["ref-instagram", "ref-youtube"], ["ref-netflix", "ref-youtube"]]
    pairForms: ["{a}이나{b}", "{a}이랑{b}", "{a}랑{b}", "{a}하고{b}", "{a}와{b}", "{a}과{b}", "{a}나{b}", "{a}, {b}", "{a}·{b}", "{a} 그리고 {b}", "{a} and {b}", "{a} or {b}", "{a} 또는 {b}", "{a} 아니면 {b}"]
  less:
    into: less-blocker
    minStem: 2
    forms: ["{w}한 거 줄", "{w}한 건 줄", "{w}한 걸 줄", "{w}함 줄", "{w}한 것 줄", "{w} 줄여", "덜 {w}"]
    liteForms: ["덜 {w}"]

entries:

  - id: warm
    kind: impression
    label: 따뜻함
    copyWords: ["따뜻", "포근", "아늑", "정겨", "훈훈", "푸근"]
    lessStems: true
    match:
      ko: ["따뜻", "포근", "아늑", "정겨", "정감", "훈훈", "푸근"]
      en: ["warm", "cozy", "homey", "snug", "homely", "warmer"]
    not: ["따뜻한 커피", "따뜻한 차", "따뜻한 국물", "따뜻한 라떼", "따뜻한 음료", "덜 따뜻", "덜 따스"]
    reading:
      - { axis: color-temperature, direction: warm, strength: 1 }
      - { axis: shape, direction: round, strength: 1 }
    say:
      ko: "색을 따뜻한 쪽으로, 모서리를 부드러운 쪽으로 이해했어요."
      en: "I read this as warmer colours and softer corners."
    confidence: high
    mood:
      tokens: ["warm", "earthy", "cozy", "sunset", "sunshine"]
      recipeTokens: ["손맛", "저녁", "장터", "인쇄", "숲", "친근", "말랑", "손끝"]

  - id: friendly
    kind: impression
    label: 친근함
    copyWords: ["친근", "친절", "다정", "상냥", "캐주얼"]
    lessStems: true
    match:
      ko: ["친근", "친절", "다정", "상냥", "정다", "살가", "캐주얼"]
      en: ["friendly", "welcoming", "approachable", "gentle", "inviting", "casual", "friendlier"]
    not: ["친절 상담", "친절한 직원"]
    reading:
      - { axis: shape, direction: round, strength: 1 }
      - { axis: type-family, value: rounded-sans, strength: 1 }
      - { axis: contrast, direction: soft, strength: 1 }
    say:
      ko: "모서리를 둥글게, 글꼴을 둥근 쪽으로, 대비를 은은하게 이해했어요."
      en: "I read this as rounder shapes, a rounder typeface and softer contrast."
    confidence: high
    mood:
      tokens: ["warm", "soft", "approachable", "inviting", "cheerful", "pastel"]
      recipeTokens: ["친근", "말랑", "손끝"]

  - id: bold
    kind: impression
    label: 대담함
    lessStems: true
    match:
      ko: ["대담", "과감", "강렬", "도전", "파격", "묵직", "임팩트"]
      en: ["bold", "strong", "intense", "daring", "powerful", "dramatic", "bolder", "louder", "stronger", "striking"]
    not: ["과감한 할인", "파격 할인", "도전 정신"]
    reading:
      - { axis: contrast, direction: crisp, strength: 2 }
      - { axis: color-saturation, direction: vivid, strength: 1 }
      - { axis: type-scale, direction: larger, strength: 1 }
    say:
      ko: "대비를 또렷하게, 색을 쨍하게, 제목을 크게 이해했어요."
      en: "I read this as sharper contrast, punchier colour and bigger headings."
    confidence: high
    mood:
      tokens: ["bold", "neon", "vibrant", "intense", "dramatic", "high-contrast"]
      recipeTokens: ["대담", "거침", "직설", "대비", "신호"]

  - id: lively
    kind: impression
    label: 활기참
    copyWords: ["활기", "발랄", "경쾌", "유쾌"]
    lessStems: true
    match:
      ko: ["활기", "활발", "생동", "경쾌", "발랄", "신나", "유쾌", "에너지", "화려"]
      en: ["lively", "energetic", "playful", "fun", "cheerful", "upbeat", "vivid"]
    not: ["에너지 드링크", "에너지 절약", "에너지 효율", "에너지 음료", "에너지 바"]
    reading:
      - { axis: color-saturation, direction: vivid, strength: 1 }
      - { axis: motion, direction: dynamic, strength: 1 }
      - { axis: palette-count, direction: more, strength: 1 }
    say:
      ko: "색을 쨍하게, 움직임을 더하고 색 가짓수를 늘리는 쪽으로 이해했어요."
      en: "I read this as punchier colour, more motion and a wider palette."
    confidence: high
    mood:
      tokens: ["energetic", "vibrant", "playful", "cheerful", "bright", "energy"]
      recipeTokens: ["신호", "말랑", "대담"]

  - id: calm
    kind: impression
    label: 차분함
    copyWords: ["차분"]
    lessStems: true
    match:
      ko: ["차분", "고요", "조용", "평온", "잔잔", "편안", "평화", "절제", "힐링", "덜 화려", "화려한 거 줄", "화려한 건 줄", "화려한 걸 줄", "화려함 줄", "덜 튀", "튀는 거 줄", "튀는 건 줄", "덜 요란"]
      en: ["calm", "quiet", "serene", "peaceful", "tranquil", "relaxed", "calmer", "quieter"]
    not: ["조용한 동네", "평화 시장"]
    reading:
      - { axis: motion, direction: static, strength: 1 }
      - { axis: color-saturation, direction: muted, strength: 1 }
      - { axis: contrast, direction: soft, strength: 1 }
    say:
      ko: "움직임을 줄이고, 색을 흐리게, 대비를 은은하게 이해했어요."
      en: "I read this as less motion, muted colour and softer contrast."
    confidence: high
    mood:
      tokens: ["calm", "muted", "cool", "soft", "hush", "balanced"]
      recipeTokens: ["차분", "고요", "조용", "느림", "절제"]

  - id: neat
    kind: impression
    label: 단정함
    copyWords: ["간결", "깔끔", "심플", "명료", "명쾌", "군더더기"]
    lessStems: true
    match:
