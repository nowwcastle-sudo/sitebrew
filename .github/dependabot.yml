# P3-8 — Dependabot 버전 업데이트(npm + github-actions). 보안 업데이트·경보는 저장소 설정(대표)이 따로 켠다.
# 정확한 버전으로 고정한 의존성(react·next·gsap·axe-core·sharp …)은 레지스트리 pincheck·시각 기준과 묶여 있어 PR 이 와도 컨트롤러가 ci:verify 와 시각 판정을 거쳐 올린다.
# cooldown: 갓 나온 버전을 바로 설치하지 않는다(보안 업데이트에는 적용되지 않는다 — 문서).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
          - '@next/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      npm-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - next
          - eslint-config-next
          - '@next/*'
          - react
          - react-dom
    ignore:
      # shadcn 은 설치 명령(`npx shadcn@<고정판> …`)·템플릿 잠금·README 5개 언어·pincheck 가 모두 같은 정확한 판에 고정돼 있어 출시 단위로 함께 올린다. 단독 PR 은 받지 않는다.
      - dependency-name: shadcn
      # 실행 환경이 Node 24(engines)라 @types/node 는 24.x 안에서만 올린다. 25 이상 major 는 받지 않는다.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # typescript 7 은 받지 않는다: typescript-eslint 가 TS 7 을 지원하지 않아(`>=4.8.4 <6.1.0`, 실행하면 "typescript-eslint does not support TS 7.0" 로 lint 가 멈춘다) 지원이 나올 때까지 7 이상을 막는다.
      - dependency-name: typescript
        versions:
          - '>=7'
      # eslint 10 은 받지 않는다: eslint-config-next 가 끌어오는 eslint-plugin-react 7.37.5 가 ESLint 10 에서 규칙을 못 불러오고
      # ("contextOrFilename.getFilename is not a function", https://github.com/vercel/next.js/issues/89764) 플러그인 peer 범위도 eslint 9 까지다.
      - dependency-name: eslint
        versions:
          - '>=10'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies

  # Sitebrew: launch-factory/ is an npm project of its own (own lock file, workspaces, template). GitHub reads only this file, so its entries live here.
  - package-ecosystem: npm
    directories:
      - '/launch-factory'
      - '/launch-factory/template'
      - '/launch-factory/packages/*'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    labels:
      - dependencies
    # the same ignore rules as launch-factory's own .github/dependabot.yml (shadcn moves only with a release: install commands, template lock and README pin 4.21.0;
    # @types/node follows the Node 24 engine; typescript-eslint does not support TypeScript 7 yet)
    ignore:
      # the workspace's own packages are not published to npm; looking them up ends every update job in a registry 404
      - dependency-name: '@launch-factory/*'
      - dependency-name: shadcn
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        group-by: dependency-name
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        group-by: dependency-name
