name: security

# 보안 검사(비밀값·의존성 취약점·워크플로 보안)는 ci.yml 과 따로 돈다(v0.0.12 리뷰 P1-1).
# ci.yml 은 main 푸시에만 돌고 문서·생성물만 바뀐 푸시를 건너뛴다(분 절약). 그 경로로는 훅이 꺼진 PC 에서 올린 비밀값이
# 다음 코드 푸시까지 원격에 남는다. 이 워크플로는 모든 가지 푸시·PR 에서 paths-ignore 없이 돈다 — gitleaks·OSV 는 몇십 초라 분 비용이 작다.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install pinned tools (sha256 verified)
        run: bash ci/install-security-tools.sh
      - name: actionlint
        run: actionlint -color
      - name: zizmor (offline, no SARIF)
        if: ${{ !cancelled() }}
        run: zizmor --offline --no-progress .
      - name: gitleaks (history + working tree)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1 || rc=1
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1 || rc=1
          gitleaks dir launch-factory --config launch-factory/.gitleaks.toml --redact --no-banner --verbose --exit-code 1 || rc=1
          exit "$rc"
      - name: osv-scanner (lockfile)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          osv-scanner scan source --lockfile package-lock.json --config osv-scanner.toml || rc=1
          osv-scanner scan source --lockfile launch-factory/package-lock.json --config launch-factory/osv-scanner.toml || rc=1
          exit "$rc"
